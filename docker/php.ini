; Production overrides layered on top of FrankenPHP's own defaults.

expose_php = Off

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60

; opcache.validate_timestamps=0 means PHP never stat()s source files to
; check for changes — correct for an immutable, read-only image where the
; only way code changes is a new image + container. If code is ever edited
; live inside a running container for debugging, opcache must be reset
; (`docker restart` is simplest) to see the change.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
