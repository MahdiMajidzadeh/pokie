; Process model for this container (see DEPLOY.md "Process model" for the
; full reasoning). Audited 2026-09: pTable has no ShouldQueue jobs, no
; queued mail/notifications, and no scheduled tasks (routes/console.php only
; defines the stock `inspire` command; bootstrap/app.php never calls
; ->withSchedule()). QUEUE_CONNECTION=database in .env.example is Laravel's
; installer default and is unused in practice.
;
; So this container runs only the `web` program today. supervisord still
; owns PID 1 (rather than a bare `frankenphp run` CMD) for uniformity with
; this app's sibling repos, all of which deploy as a single Dokploy
; Application the same way — adding a `worker` or `scheduler` program later
; (if pTable ever grows queued work) is then a config change here, not a
; redesign. If you add one, give it: autorestart=true, stdout/stderr logging
; with _maxbytes=0 (so `docker logs` interleaves it with `web`), and a
; stopwaitsecs sized to the job's longest expected runtime — and raise the
; Dokploy container stop timeout to match, or a redeploy SIGKILLs a job
; mid-flight.
;
; Because the container healthcheck only probes the web server (deliberately
; — it must not touch the database), a hidden dead program is the accepted
; tradeoff here. Check liveness with:
;   docker exec <container> supervisorctl status

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; These two blocks are what make `supervisorctl status` work at all — kept
; even with a single program so the liveness-check command above is uniform
; across every repo in this family, not something to relearn per repo.
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
